name: TrungTalk Android Release APK
on:
  workflow_dispatch:
  push:
    branches: [trungtalk-v1]
    paths:
      - 'TrungTalk/**'
      - '.github/workflows/trungtalk-release.yml'
permissions:
  contents: read
concurrency:
  group: trungtalk-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Release APK
        run: gradle -p TrungTalk :app:assembleRelease --stacktrace -PBACKEND_URL="${{ vars.BACKEND_URL }}"
      - name: Sign APK with CI debug key (installable artifact)
        shell: bash
        run: |
          set -euo pipefail
          APK="TrungTalk/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p "$RUNNER_TEMP/keystore"
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/keystore/ci-release.jks" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TrungTalk CI,O=TrungTalk,C=VN"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 "$APK" "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore/ci-release.jks" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/TrungTalk-release.apk" "$RUNNER_TEMP/app-aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$RUNNER_TEMP/TrungTalk-release.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$RUNNER_TEMP/TrungTalk-release.apk" | grep "package: name='com.trungtalk'"
          ls -lh "$RUNNER_TEMP/TrungTalk-release.apk"
      - name: Upload installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TrungTalk-Release-APK
          path: ${{ runner.temp }}/TrungTalk-release.apk
          if-no-files-found: error
          retention-days: 30
