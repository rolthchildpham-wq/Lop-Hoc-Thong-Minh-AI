name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android V4.5 project
        shell: bash
        run: |
          rm -rf android-source
          mkdir -p android-source
          unzip -q Android_Hybrid_V4.5_PROJECT_REUPLOAD.zip -d android-source
          test -f android-source/v45_android/app/build.gradle
          test -f android-source/v45_android/settings.gradle
          echo "Android project extracted successfully"

      - name: Apply V4.7 Android fixes
        shell: bash
        run: |
          cp android-fixes/MainActivity.java android-source/v45_android/app/src/main/java/vn/aihuedan/learn/MainActivity.java
          cat android-fixes/apk-safe-area.css >> android-source/v45_android/app/src/main/assets/www/style.css
          echo "V4.7 safe-area + native TTS fixes applied"

      - name: Build Debug APK
        working-directory: android-source/v45_android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android-source/v45_android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lop-Hoc-Thong-Minh-AI-V4.7-APK
          path: android-source/v45_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
