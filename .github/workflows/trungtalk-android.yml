name: TrungTalk Android Debug APK
on:
  push:
    branches: [trungtalk-v1]
    paths:
      - 'TrungTalk/**'
      - '.github/workflows/trungtalk-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trungtalk-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable Debug APK (retry transient Maven failures)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt/4"
            gradle -p TrungTalk :app:assembleDebug --stacktrace -PBACKEND_URL="${{ vars.BACKEND_URL }}" && exit 0
            status=$?
            if [ "$attempt" -lt 4 ]; then
              echo "Build failed (possibly Maven rate limit). Waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          exit "$status"
      - name: Verify APK package and signature
        run: |
          APK=TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.trungtalk'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrungTalk-Android-DEBUG-APK
          path: TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
