name: Deploy TrungTalk AI Worker and Build APK
on:
  push:
    branches: [trungtalk-v1]
    paths:
      - 'TrungTalk/worker/**'
      - '.github/workflows/trungtalk-cloudflare-deploy.yml'
      - 'TrungTalk/app/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trungtalk-cloud-deploy
  cancel-in-progress: false
jobs:
  deploy-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing repository secret GEMINI_API_KEY"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Worker endpoints and structured responses
        run: npm --prefix TrungTalk/worker test
      - name: Store Gemini key in Cloudflare Worker secret
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config TrungTalk/worker/wrangler.toml
      - name: Deploy Cloudflare Worker and capture URL
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config TrungTalk/worker/wrangler.toml 2>&1 | tee worker-deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' worker-deploy.log | tail -n 1)"
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::Could not extract Worker URL from deploy output. APK will be built without backend URL."
            WORKER_URL=""
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "### TrungTalk Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WORKER_URL" ]; then
            echo "- Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Health check: $WORKER_URL/health" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify Worker health (diagnostic; do not block APK build)
        shell: bash
        continue-on-error: true
        run: |
          if [ -z "$WORKER_URL" ]; then echo "::warning::Worker URL unavailable; health check skipped"; exit 0; fi
          curl -sS --show-error --fail --retry 5 --retry-delay 3 "$WORKER_URL/health" | tee health.json
          echo "Health response captured."
      - name: Test real Gemini chat endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKER_URL"
          response="$(curl -sS --show-error --fail --retry 2 --retry-delay 2 "$WORKER_URL/chat" -H 'Content-Type: application/json' -H 'x-device-id: github-ci-smoke' --data '{"message":"Trả lời đúng một câu: Backend AI đang hoạt động.","history":[],"systemPrompt":"Trả lời ngắn bằng tiếng Việt."}')"
          echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.text||j.text.trim().length<2)process.exit(1);console.log("Gemini response verified; model:",j.model||"unknown");console.log("Response:",j.text.slice(0,160))})'
      - name: Smoke-test live HSK Vietnamese translation endpoint (diagnostic)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          response="$(curl -sS --show-error --fail --retry 2 --retry-delay 2 "$WORKER_URL/translate" -H 'Content-Type: application/json' -H 'x-device-id: github-ci-translation-smoke' --data '{"words":[{"hanzi":"工作","pinyin":"gōng zuò","english":"work"},{"hanzi":"设备","pinyin":"shè bèi","english":"equipment"}]}')"
          echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.text)process.exit(1);const a=JSON.parse(j.text);const expected=new Set(["工作","设备"]);if(!Array.isArray(a)||a.length!==2||a.some(x=>!expected.has(x.hanzi)||!String(x.meaning_vi||"").trim()))process.exit(1);console.log("Live Vietnamese translation verified; model:",j.model||"unknown","words:",a.length)})'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android Debug APK
        run: gradle -p TrungTalk :app:assembleDebug --stacktrace -PBACKEND_URL="$WORKER_URL"
      - name: Verify APK signature
        run: |
          APK=TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.trungtalk'"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TrungTalk-Android-AI-DEBUG-APK
          path: TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
