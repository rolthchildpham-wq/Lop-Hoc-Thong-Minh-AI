name: Deploy TrungTalk AI Worker and Build APK
on:
  push:
    branches: [trungtalk-v1]
    paths:
      - 'TrungTalk/worker/**'
      - '.github/workflows/trungtalk-cloudflare-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trungtalk-cloud-deploy
  cancel-in-progress: false
jobs:
  deploy-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing repository secret GEMINI_API_KEY"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Store Gemini key in Cloudflare Worker secret
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config TrungTalk/worker/wrangler.toml
      - name: Deploy Cloudflare Worker
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --config TrungTalk/worker/wrangler.toml 2>&1 | tee worker-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' worker-deploy.log | tail -n 1)"
          test -n "$WORKER_URL" || { echo "::error::Could not detect workers.dev URL. Check whether workers.dev is enabled for this Cloudflare account."; exit 1; }
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "### TrungTalk Worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: $WORKER_URL/health" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Worker health
        run: |
          curl --fail --retry 5 --retry-delay 3 "$WORKER_URL/health"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android Debug APK connected to Worker
        run: gradle -p TrungTalk :app:assembleDebug --stacktrace -PBACKEND_URL="$WORKER_URL"
      - name: Verify APK signature
        run: |
          APK=TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='com.trungtalk'"
      - name: Upload connected Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TrungTalk-Android-AI-DEBUG-APK
          path: TrungTalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
